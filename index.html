const S={Melee:[["Swords",/sword/i],["Axes",/\baxe/i],["Any weapon",/weapons/i]],Ranged:[["Bows",/\bbows?\b/i],["Crossbows",/crossbow/i],["Tridents",/trident/i]],Armor:[["Helmets",/helmet/i],["Chestplates",/chestplate/i],["Leggings",/leggings/i],["Boots",/boots/i],["Elytra",/elytra/i],["Any armor",/\barmor/i]],Tools:[["Pickaxes",/pickaxe/i],["Shovels",/shovel/i],["Hoes",/hoe/i],["Any tool",/\btools?\b/i]]};
let cur="All",sub=null,shown=[];
const subOK=e=>{if(!sub)return true;const x=(S[cur]||[]).find(v=>v[0]==sub);if(!x)return true;return sub.startsWith("Any")?x[1].test(e.a):x[1].test(e.a)||!!(G[cur]&&G[cur].test(e.a))};
function drawSub(){const l=S[cur]||[];$("sub").innerHTML=l.length>1?`<button data-s="" class="on">All</button>`+l.map(v=>`<button data-s="${v[0]}">${v[0]}</button>`).join(""):""}const $=id=>document.getElementById(id);
$("chips").innerHTML=Object.keys(F).map(k=>`<button data-k="${k}" class="${k=="All"?"on":""}">${k}</button>`).join("")+`<select id="sort" aria-label="Sort"><option value="n">A–Z</option><option value="m">Highest level</option></select>`;
function render(){
 const q=$("q").value.toLowerCase().trim(),s=$("sort").value;
 let r=D.filter(e=>F[cur].test(e.a)&&subOK(e)&&(e.n+" "+e.d+" "+e.a).toLowerCase().includes(q));
 r.sort((x,y)=>s=="m"?y.m-x.m||x.n.localeCompare(y.n):x.n.localeCompare(y.n));
 shown=r;$("count").textContent=r.length+" of "+D.length+" enchantments"+(r.length?"":" – no cats found here, try another search");
 const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
 $("grid").innerHTML=r.map((e,n)=>{const t=tr(e.m);return `<article class="card t${t}" data-k="${n}" tabindex="0" style="--i:${Math.min(n,16)}"><h3>${esc(e.n)}</h3><div class="meter" aria-hidden="true">${Array.from({length:10},(_,i)=>`<i class="${i<e.m?"f":""}"></i>`).join("")}<b>${TN[t]}</b></div><p>${esc(e.d)}</p><div class="tags"><span class="lv">Max Lv ${e.m}</span>${e.a.split(/, | and /).map(t=>`<span>${esc(t)}</span>`).join("")}</div></article>`}).join("");
}
$("chips").addEventListener("click",e=>{const k=e.target.dataset.k;if(!k)return;cur=k;sub=null;drawSub();document.querySelectorAll("#chips button").forEach(b=>b.classList.toggle("on",b.dataset.k==k));render()});
$("sub").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;sub=b.dataset.s||null;document.querySelectorAll("#sub button").forEach(x=>x.classList.toggle("on",x===b));render()});
$("q").addEventListener("input",render);$("chips").addEventListener("change",render);render();
(()=>{const c=document.getElementById("cat"),w=document.getElementById("cw"),t=c.querySelector(".bub text"),M=["Meow!","Purr...","Mrrp?","Pet me more!","Welcome to Mokoko!","Nyaa~"];let i=0,tm;const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
let off=false;try{off=localStorage.getItem("mk-sound")=="0"}catch(e){}
let ac;function meow(){if(off)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=="suspended")ac.resume();const t=ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain(),b=480+Math.random()*160,d=.45+Math.random()*.2;o.type="sawtooth";o.frequency.setValueAtTime(b*.8,t);o.frequency.linearRampToValueAtTime(b*1.5,t+d*.35);o.frequency.exponentialRampToValueAtTime(b*.7,t+d);f.type="bandpass";f.Q.value=3;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(2000,t+d*.4);f.frequency.linearRampToValueAtTime(1000,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.05);g.gain.linearRampToValueAtTime(.001,t+d);o.connect(f);f.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function pet(m){if(typeof m!="string")meow();t.textContent=typeof m=="string"?m:M[i++%M.length];c.classList.add("awake");if(!rm)for(let k=0;k<3;k++){const h=document.createElement("span");h.className="heart";h.textContent="\u2665";h.style.left=(52+Math.random()*30)+"%";h.style.top=(25+Math.random()*15)+"%";h.style.animationDelay=k*120+"ms";w.appendChild(h);setTimeout(()=>h.remove(),1800)}clearTimeout(tm);tm=setTimeout(()=>c.classList.remove("awake"),3500)}
const sn=document.getElementById("sn"),sl=()=>sn.textContent=off?"Sound: off":"Sound: on";sl();sn.onclick=()=>{off=!off;try{localStorage.setItem("mk-sound",off?"0":"1")}catch(e){}sl();if(!off)meow()};
window.catSay=pet;c.addEventListener("click",pet);c.addEventListener("keydown",e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();pet()}})})();
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)for(let i=0;i<22;i++){const o=document.createElement("i");o.className="pt";const z=9+Math.random()*8;o.style.cssText=`left:${Math.random()*98}%;width:${z}px;height:${z*.8}px;--sw:${Math.random()*240-120}px;animation-duration:${12+Math.random()*10}s,${3+Math.random()*3}s;animation-delay:${-Math.random()*22}s,${-Math.random()*5}s`;document.body.appendChild(o)}
(()=>{const r=document.documentElement,b=document.getElementById("tg");const dk=()=>r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;const lab=()=>b.textContent=dk()?"Light mode":"Dark mode";try{const t=localStorage.getItem("mk-theme");if(t)r.dataset.theme=t}catch(e){}lab();b.onclick=()=>{r.dataset.theme=dk()?"light":"dark";try{localStorage.setItem("mk-theme",r.dataset.theme)}catch(e){}lab()}})();
const dlg=$("dlg");let cx;const PC=["","#5fae86","#9b72d1","#e0a02e","#e0679a"];
function lv(){const v=+$("lvr").value;$("lvn").textContent=v+" / "+cx.m;$("dm").innerHTML=Array.from({length:10},(_,i)=>`<i class="${i<v?"f":""}"></i>`).join("")}
function openD(x){cx=x;const t=tr(x.m);dlg.style.setProperty("--pip",PC[t]);$("dn").textContent=x.n;$("dt").textContent=TN[t]+" - max Lv "+x.m;$("dd").textContent=x.d;$("da").innerHTML=x.a.split(/, | and /).map(v=>`<span>${v.replace(/</g,"&lt;")}</span>`).join("");const g=$("lvr");g.max=x.m;g.value=x.m;g.disabled=x.m<2;lv();dlg.showModal()}
$("lvr").oninput=lv;$("dx").onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target===dlg)dlg.close()};
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText(`${cx.n} (max Lv ${cx.m}): ${cx.d} Works on: ${cx.a}`);$("cp").textContent="Copied!";window.catSay&&catSay("Copied!")}catch(e){$("cp").textContent="Copy failed"}setTimeout(()=>$("cp").textContent="Copy",1500)};
$("grid").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)openD(shown[+c.dataset.k])});
$("grid").addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.classList.contains("card"))openD(shown[+e.target.dataset.k])});
$("q").addEventListener("input",()=>{if(!shown.length&&window.catSay)catSay("Nothing here...")});
</script></body></html>
