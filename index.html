function updateURL(){
 const l = new URL(window.location);
 l.searchParams.set('cat', cur);

function render(){
 const q=$("q").value.toLowerCase().trim(),s=$("sort").value,tier=$("tier").value;
 let r=D.filter(e=>{
  if(cur === 'Favs'){ if(!favs.includes(e.n)) return false; }
  else { if(!F[cur].test(e.a)||!subOK(e)) return false; }
  if(tier!=='all'&&tr(e.m)!=tier) return false;
  return (e.n+" "+e.d+" "+e.a).toLowerCase().includes(q);
 });
 r.sort((x,y)=>s=="m"?y.m-x.m||x.n.localeCompare(y.n):x.n.localeCompare(y.n));
 shown=r;

 }
 $("count").textContent=r.length+" of "+(cur==='Favs'?favs.length:D.length)+" enchantments";
 $("grid").innerHTML=r.map((e,n)=>{

}

(()=>{const c=$("cat"),w=$("cw"),t=c.querySelector(".bub text"),M=["Meow!","Purr...","Mrrp?","Pet me more!","Welcome to Mokoko!","Nyaa~"];let i=0,tm;const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
let off=false;try{off=localStorage.getItem("mk-sound")=="0"}catch(e){}
let ac;

function meow(shocked=false, fast=false){
    if(off)return;
    try{
        ac=ac||new(window.AudioContext||window.webkitAudioContext)();
        if(ac.state=="suspended")ac.resume();
        const t=ac.currentTime, o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain();
        
        let type = shocked ? 3 : (fast ? 4 : Math.floor(Math.random()*3));
        let b = 350 + Math.random()*150;
        let d = 0.5 + Math.random()*0.3;
        
        if (type === 4) { // Realistic "Nom nom nom"
            d = 0.65;
            o.type = "sine";
            f.type = "lowpass"; f.Q.value = 2;
            g.gain.setValueAtTime(0, t);
            
            for(let k=0; k<3; k++){
                let st = t + k*0.2;
                o.frequency.setValueAtTime(450, st);
                o.frequency.exponentialRampToValueAtTime(250, st+0.15);
                
                f.frequency.setValueAtTime(1500, st);
                f.frequency.exponentialRampToValueAtTime(300, st+0.15);
                
                g.gain.setValueAtTime(0.01, st);
                g.gain.linearRampToValueAtTime(0.6, st+0.05);
                g.gain.exponentialRampToValueAtTime(0.01, st+0.18);
            }
            g.gain.linearRampToValueAtTime(0, t+0.6);
            o.connect(f);f.connect(g);g.connect(ac.destination);
            o.start(t);o.stop(t+d);
            return;
        }

        o.type = shocked ? "triangle" : "sawtooth";
        f.type = "bandpass"; f.Q.value = 4;
        
        if (type === 0) { // Standard meow
            o.frequency.setValueAtTime(b, t);
            o.frequency.exponentialRampToValueAtTime(b*1.4, t+d*0.3);
            o.frequency.exponentialRampToValueAtTime(b*0.7, t+d);
            f.frequency.setValueAtTime(b, t);
            f.frequency.linearRampToValueAtTime(b*2.5, t+d*0.3);
            f.frequency.linearRampToValueAtTime(b, t+d);
        } else if (type === 1) { // Mrrp (trill)
            d = 0.4 + Math.random()*0.2;
            b = 450 + Math.random()*100;
            o.frequency.setValueAtTime(b, t);
            o.frequency.linearRampToValueAtTime(b*1.2, t+d*0.2);
            o.frequency.linearRampToValueAtTime(b*0.9, t+d*0.4);
            o.frequency.linearRampToValueAtTime(b*1.3, t+d*0.6);
            o.frequency.linearRampToValueAtTime(b*0.8, t+d);
            f.frequency.setValueAtTime(b, t);
            f.frequency.linearRampToValueAtTime(b*2, t+d*0.5);
            f.frequency.linearRampToValueAtTime(b, t+d);
        } else if (type === 2) { // High cute squeak
            d = 0.35 + Math.random()*0.15;
            b = 550 + Math.random()*150;
            o.type = "triangle";
            o.frequency.setValueAtTime(b, t);
            o.frequency.exponentialRampToValueAtTime(b*1.3, t+d*0.4);
            o.frequency.exponentialRampToValueAtTime(b*0.8, t+d);
            f.frequency.setValueAtTime(b*1.5, t);
            f.frequency.linearRampToValueAtTime(b*3, t+d*0.4);
            f.frequency.linearRampToValueAtTime(b*1.5, t+d);
        } else if (type === 3) { // Shocked tail grab
            d = 0.3;
            b = 650 + Math.random()*100;
            o.type = "triangle";
            o.frequency.setValueAtTime(b, t);
            o.frequency.exponentialRampToValueAtTime(b*1.2, t+d*0.2);
            o.frequency.exponentialRampToValueAtTime(b*0.6, t+d);
            f.frequency.setValueAtTime(b*2, t);
            f.frequency.linearRampToValueAtTime(b*3, t+d*0.2);
            f.frequency.linearRampToValueAtTime(b*1.5, t+d);
        }
        
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(shocked ? 0.5 : 0.35, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        
        o.connect(f);f.connect(g);g.connect(ac.destination);
        o.start(t);o.stop(t+d+0.1);
    } catch(e) {}
}

function pet(m,shocked=false,fast=false){if(typeof m!="string")meow(shocked,fast);t.textContent=typeof m=="string"?m:M[i++%M.length];c.classList.add("awake");if(shocked)c.classList.add("shocked");else c.classList.remove("shocked");if(!rm&&!shocked)for(let k=0;k<3;k++){const h=document.createElement("span");h.className=fast?"fish":"heart";h.textContent=fast?"🐟":"\u2665";h.style.left=(52+Math.random()*30)+"%";h.style.top=(25+Math.random()*15)+"%";h.style.animationDelay=k*120+"ms";w.appendChild(h);setTimeout(()=>h.remove(),1800)}clearTimeout(tm);tm=setTimeout(()=>{c.classList.remove("awake");c.classList.remove("shocked");$("eyeL").style.transform="";$("eyeR").style.transform="";},3500)}

const el=$("eyeL"),er=$("eyeR");
document.addEventListener("mousemove",e=>{
    if(!c.classList.contains("awake")||c.classList.contains("shocked"))return;
    const r=c.getBoundingClientRect();
    const cx=r.left+r.width*0.6,cy=r.top+r.height*0.5;
    const dx = (e.clientX-cx)/80, dy = (e.clientY-cy)/80;
    // Fix: Strict clamped values so eyes do not overlap the pink cheeks
    const ax=Math.max(-3,Math.min(3,dx));
    const ay=Math.max(-3,Math.min(1.5,dy)); 
    el.style.transform=`translate(${ax}px,${ay}px)`;
    er.style.transform=`translate(${ax}px,${ay}px)`;
});
