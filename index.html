<style>
:root{
  --bg:#f7eef4;--card:#fffafca6;--ink:#4b3552;--soft:#8a7391;--sage:#a8cdb5;--butter:#f8dc93;--peach:#f7bfae;--lilac:#d9c6ec;--line:#ecd9e6;
  --c-exotic:#ec493e;--c-legendary:#f5a014;--c-cosmic:#9886e5;--c-divine:#2cc6e2;--c-celestial:#2ede89;--c-secret:#e972a5;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2030;--card:#372a3f99;--ink:#f6e9f2;--soft:#c0a9c9;--line:#4b3a55;--lilac:#5b4472;--sage:#5c8a6f;--butter:#c9a54a;--peach:#c27f6c}}
:root[data-theme="dark"]{--bg:#2a2030;--card:#372a3f99;--ink:#f6e9f2;--soft:#c0a9c9;--line:#4b3a55;--lilac:#5b4472;--sage:#5c8a6f;--butter:#c9a54a;--peach:#c27f6c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:400 16px/1.5 Nunito,system-ui,sans-serif}
.bg-blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);transition:background .3s}
.b1,.b2{position:absolute;width:1px;height:1px;border-radius:50%;opacity:.2;transition:box-shadow .8s ease,transform 1.2s ease-in-out}
.b1{top:10%;left:20%;box-shadow:0 0 60vw 50vw var(--grad1)}
.b2{bottom:10%;right:20%;box-shadow:0 0 70vw 55vw var(--grad2)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px 60px}
header{text-align:center;padding:34px 0 10px}
h1{font:600 clamp(2.2rem,7vw,3.8rem)/1.1 Fredoka,sans-serif;margin:8px 0 6px;letter-spacing:.5px;background:linear-gradient(90deg,#ec493e,#f5a014,#9886e5,#2cc6e2,#2ede89,#e972a5,#ec493e);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:200% center}}
header p{margin:0 auto;max-width:520px;color:var(--soft)}
.cat{width:min(300px,80%);display:block;margin:0 auto}
.tail{transform-origin:20px 100px;animation:wag 3s ease-in-out infinite;cursor:pointer}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent);padding:12px 0;margin-top:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.search-wrap{position:relative;display:flex;align-items:center}

.kb{position:absolute;right:18px;font-size:.7rem;color:var(--soft);pointer-events:none;background:var(--line);padding:2px 8px;border-radius:8px;font-weight:700;transition:opacity .2s}
.clr{position:absolute;right:12px;background:var(--line);border:none;color:var(--ink);width:26px;height:26px;border-radius:50%;padding:0;font-size:1rem;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer}
.clr.show{display:flex}
.clr.show + .kb, input:focus ~ .kb{opacity:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button{font:600 .9rem Nunito;padding:7px 15px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
button.on{background:var(--sage);border-color:var(--sage);color:#1f2d25;box-shadow:0 0 16px var(--sage)}
button[data-k="Favs"]{border-style:dashed}
button[data-k="Favs"].on{background:#e972a5;border-color:#e972a5;color:#fff;box-shadow:0 0 16px rgba(233,114,165,.6);border-style:solid}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}
.filters{display:flex;gap:8px;margin-left:auto}
select{padding:7px 12px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#count{color:var(--soft);margin:0 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px 16px;padding-top:14px}
.card{--ac:var(--c-exotic);--pip:var(--c-exotic);position:relative;background:var(--card);border:2px solid color-mix(in srgb,var(--ac) 75%,var(--line));border-radius:22px;padding:18px 16px 14px;transition:transform .2s,box-shadow .2s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 12px 28px -8px var(--ac)}
.card:focus-within{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.t1{--ac:var(--c-exotic);--pip:var(--c-exotic)}
.t2{--ac:var(--c-legendary);--pip:var(--c-legendary)}
.t3{--ac:var(--c-cosmic);--pip:var(--c-cosmic)}
.t4{--ac:var(--c-divine);--pip:var(--c-divine)}
.t5{--ac:var(--c-celestial);--pip:var(--c-celestial);background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--c-celestial) 14%,var(--card)))}
.t6{--ac:var(--c-secret);--pip:var(--c-secret);background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--c-secret) 18%,var(--card)))}
.card:before,.card:after{content:"";position:absolute;top:-13px;width:0;height:0;border:12px solid transparent;border-bottom:16px solid color-mix(in srgb,var(--ac) 75%,var(--line))}
.card:before{left:20px;border-left-width:8px;border-right-width:16px}
.card:after{right:20px;border-right-width:8px;border-left-width:16px}
.card h3{font:600 1.15rem Fredoka;margin:0 0 4px;padding-right:24px;color:var(--pip)}
.card p{margin:0 0 10px;font-size:.92rem;color:var(--soft)}
.meter{display:flex;gap:3px;align-items:center;margin-bottom:9px}
.meter i{width:13px;height:7px;border-radius:4px;background:color-mix(in srgb,var(--ink) 16%,transparent)}
.meter i.f{background:var(--pip)}
.meter b{margin-left:8px;font:600 .78rem Fredoka;color:var(--pip)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{background:var(--lilac);border-radius:12px;padding:2px 10px;font-size:.78rem;font-weight:700}
.tags span:not(.lv){cursor:pointer;transition:background .2s,transform .1s}
.tags span:not(.lv):hover{background:var(--pip);color:#1a1320;transform:scale(1.05)}
.tags .lv{background:var(--butter);color:#4b3552}
button.fav-btn{position:absolute;top:14px;right:12px;background:transparent;border:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:5px;font-size:1.3rem;line-height:1;color:color-mix(in srgb,var(--line) 80%,transparent);cursor:pointer;border-radius:50%;z-index:2;box-shadow:none}
button.fav-btn:hover{transform:scale(1.2);background:transparent}

header .legend{margin-top:12px;font-size:.9rem;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
header .legend b{padding:2px 10px;border-radius:12px;background:var(--card);border:1px solid color-mix(in srgb,currentColor 45%,transparent)}
@keyframes rise{from{opacity:0;transform:translateY(25px) scale(.95)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes glow{50%{box-shadow:0 0 22px -4px var(--ac)}}

.card{animation:rise .5s backwards;animation-delay:calc(var(--i)*50ms)}
.t5,.t6{animation:rise .5s backwards,glow 3s ease-in-out infinite;animation-delay:calc(var(--i)*50ms),0s}
.meter i.f{transform-origin:left;animation:grow .5s backwards;animation-delay:calc(var(--i)*50ms + .2s)}
.card:hover .meter i.f{animation:grow .5s backwards}
.cat{transform-origin:50% 90%;animation:breathe 4s ease-in-out infinite}
button{transition:transform .15s,background .2s}button:hover{transform:translateY(-2px)}button:active{transform:scale(.92)}
.wrap{position:relative;z-index:1}
.sub:empty{display:none}.sub{margin-top:8px}
.sub button{font-size:.8rem;padding:4px 12px;animation:rise .3s backwards}
.sub button.on{background:var(--lilac);border-color:var(--lilac);box-shadow:0 0 12px var(--lilac)}
.catwrap{position:relative;width:min(300px,80%);margin:0 auto}
.catwrap .cat{width:100%;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.catwrap:hover .cat{filter:drop-shadow(0 6px 10px rgba(233,114,165,.35))}
.cat,.cat:focus,.cat:active{outline:none;user-select:none;-webkit-user-select:none}
.cat:focus-visible{filter:drop-shadow(0 0 8px #9886e5)}
.eO{display:none}.bub{opacity:0;transition:opacity .2s}
.awake .eC{display:none}.awake .eO{display:inline}.awake .bub{opacity:1}
.awake .z{animation:none;opacity:0}.awake .tail{animation-duration:.5s}
.shocked .tail{animation:tailShock .2s ease-in-out infinite}
@keyframes tailShock{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-30deg) scale(1.1)}}
.pupil{transition:r .3s, transform .1s}
[data-theme="dark"] .awake .pupil{r:6.5px}
.heart, .fish{position:absolute;pointer-events:none;font-size:22px;animation:up 1.5s ease-out both}
.heart{color:#e972a5}
@keyframes up{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-100px) scale(1.2)}}
.pt{position:fixed;top:-30px;z-index:0;pointer-events:none;background:linear-gradient(135deg,#ffdce9,#f4a3c3);border-radius:150% 0 150% 0;box-shadow:0 0 6px rgba(244,163,195,.5);animation:petalFall linear infinite,petalSpin ease-in-out infinite alternate}
@keyframes petalFall{0%{transform:translate(0,0);opacity:0}8%{opacity:.9}50%{transform:translate(calc(var(--sw)*-.6),55vh)}92%{opacity:.9}100%{transform:translate(var(--sw),108vh);opacity:0}}
@keyframes petalSpin{from{rotate:0deg}to{rotate:300deg}}
.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:16px}
.nav a{font:600 .9rem Nunito;padding:7px 16px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
.nav a[aria-current]{background:var(--lilac);border-color:var(--lilac)}
.card{cursor:pointer}
dialog{--pip:#2ede89;border:2px solid var(--pip);border-radius:24px;background:var(--card);color:var(--ink);padding:0;width:min(440px,calc(100% - 32px));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
dialog[open]{animation:rise .3s}dialog::backdrop{background:rgba(40,25,50,.5);backdrop-filter:blur(5px)}
.di{padding:22px}.dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.dh h3{font:600 1.4rem Fredoka;margin:0;padding-right:10px;color:var(--pip)}
dialog p{color:var(--soft);margin:10px 0}dialog label{display:block;margin:16px 0 6px;font-weight:700}
dialog input[type=range]{padding:0;border:0;accent-color:var(--pip)}
dialog input[type=range]{backdrop-filter:none;-webkit-backdrop-filter:none}
.fmt-box{margin-top:12px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--line) 45%,transparent);font-size:.85rem;color:var(--ink);word-break:break-word}
footer{text-align:center;color:var(--soft);padding:40px 0 0}
.empty{grid-column:1 / -1;text-align:center;padding:50px 20px;color:var(--soft);animation:rise .5s backwards;background:var(--card);border:2px dashed var(--line);border-radius:24px;backdrop-filter:blur(12px)}
.empty .e-icon{font-size:4rem;margin-bottom:10px;display:inline-block;animation:breathe 3s ease-in-out infinite}
.empty h2{font-family:Fredoka,sans-serif;color:var(--ink);margin:0 0 10px;font-size:1.6rem}
#btt{position:fixed;bottom:30px;right:30px;z-index:50;width:48px;height:48px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:var(--card);border:2px solid var(--lilac);color:var(--ink);opacity:0;pointer-events:none;transform:translateY(20px);transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:0 8px 24px rgba(0,0,0,.1)}
#btt.show{opacity:1;pointer-events:auto;transform:translateY(0)}
#btt:hover{transform:translateY(-5px);background:var(--lilac);color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.15)}
#btt svg{width:22px;height:22px}
</style></head><body>

<header>

<h1>Mokoko Enchantment Café</h1>
<p>Every custom enchantment on the Mokoko server, curled up in one cozy menu. Pick a favorite and stay a while.</p>
<p class="legend">
  <b style="color:var(--c-exotic)">Exotic</b>
  <b style="color:var(--c-legendary)">Legendary</b>
  <b style="color:var(--c-cosmic)">Cosmic</b>
  <b style="color:var(--c-divine)">Divine</b>
  <b style="color:var(--c-celestial)">Celestial</b>
  <b style="color:var(--c-secret)">Secret</b>
</p>

<script>

let ac;

function meow(shocked=false, fast=false){
    if(off)return;
    try{
        ac=ac||new(window.AudioContext||window.webkitAudioContext)();
        if(ac.state=="suspended")ac.resume();
        const t=ac.currentTime, o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain();
        
        let type = shocked ? 3 : (fast ? 4 : Math.floor(Math.random()*3));
        let b = 350 + Math.random()*150;
        let d = 0.5 + Math.random()*0.3;
        
        if (type === 4) { // Realistic "Nom nom nom"
            d = 0.65;
            o.type = "sine";
            f.type = "lowpass"; f.Q.value = 2;
            g.gain.setValueAtTime(0, t);
            
            for(let k=0; k<3; k++){
                let st = t + k*0.2;
                o.frequency.setValueAtTime(450, st);
                o.frequency.exponentialRampToValueAtTime(250, st+0.15);
                
                f.frequency.setValueAtTime(1500, st);
                f.frequency.exponentialRampToValueAtTime(300, st+0.15);
                
                g.gain.setValueAtTime(0.01, st);
                g.gain.linearRampToValueAtTime(0.6, st+0.05);
                g.gain.exponentialRampToValueAtTime(0.01, st+0.18);
            }
            g.gain.linearRampToValueAtTime(0, t+0.6);
            o.connect(f);f.connect(g);g.connect(ac.destination);
            o.start(t);o.stop(t+d);
            return;
        }

        o.type = shocked ? "triangle" : "sawtooth";
        f.type = "bandpass"; f.Q.value = 4;
        
        if (type === 0) { // Standard meow
            o.frequency.setValueAtTime(b, t);
            o.frequency.exponentialRampToValueAtTime(b*1.4, t+d*0.3);
            o.frequency.exponentialRampToValueAtTime(b*0.7, t+d);
            f.frequency.setValueAtTime(b, t);
            f.frequency.linearRampToValueAtTime(b*2.5, t+d*0.3);
            f.frequency.linearRampToValueAtTime(b, t+d);
        } else if (type === 1) { // Mrrp (trill)
            d = 0.4 + Math.random()*0.2;
            b = 450 + Math.random()*100;
            o.frequency.setValueAtTime(b, t);
            o.frequency.linearRampToValueAtTime(b*1.2, t+d*0.2);
            o.frequency.linearRampToValueAtTime(b*0.9, t+d*0.4);
            o.frequency.linearRampToValueAtTime(b*1.3, t+d*0.6);
            o.frequency.linearRampToValueAtTime(b*0.8, t+d);
            f.frequency.setValueAtTime(b, t);
            f.frequency.linearRampToValueAtTime(b*2, t+d*0.5);
            f.frequency.linearRampToValueAtTime(b, t+d);
        } else if (type === 2) { // High cute squeak
            d = 0.35 + Math.random()*0.15;
            b = 550 + Math.random()*150;
            o.type = "triangle";
            o.frequency.setValueAtTime(b, t);
            o.frequency.exponentialRampToValueAtTime(b*1.3, t+d*0.4);
            o.frequency.exponentialRampToValueAtTime(b*0.8, t+d);
            f.frequency.setValueAtTime(b*1.5, t);
            f.frequency.linearRampToValueAtTime(b*3, t+d*0.4);
            f.frequency.linearRampToValueAtTime(b*1.5, t+d);
        } else if (type === 3) { // Shocked tail grab
            d = 0.3;
            b = 650 + Math.random()*100;
            o.type = "triangle";
            o.frequency.setValueAtTime(b, t);
            o.frequency.exponentialRampToValueAtTime(b*1.2, t+d*0.2);
            o.frequency.exponentialRampToValueAtTime(b*0.6, t+d);
            f.frequency.setValueAtTime(b*2, t);
            f.frequency.linearRampToValueAtTime(b*3, t+d*0.2);
            f.frequency.linearRampToValueAtTime(b*1.5, t+d);
        }
        
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(shocked ? 0.5 : 0.35, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        
        o.connect(f);f.connect(g);g.connect(ac.destination);
        o.start(t);o.stop(t+d+0.1);
    } catch(e) {}
}

});
})();
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)for(let i=0;i<22;i++){const o=document.createElement("i");o.className="pt";const z=9+Math.random()*8;o.style.cssText=`left:${Math.random()*98}%;width:${z}px;height:${z*.8}px;--sw:${Math.random()*240-120}px;animation-duration:${12+Math.random()*10}s,${3+Math.random()*3}s;animation-delay:${-Math.random()*22}s,${-Math.random()*5}s`;document.body.appendChild(o)}
(()=>{const r=document.documentElement,b=document.getElementById("tg");const dk=()=>r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;const lab=()=>b.textContent=dk()?"Light mode":"Dark mode";try{const t=localStorage.getItem("mk-theme");if(t)r.dataset.theme=t}catch(e){}lab();b.onclick=()=>{r.dataset.theme=dk()?"light":"dark";try{localStorage.setItem("mk-theme",r.dataset.theme)}catch(e){}lab()}})();
const dlg=$("dlg"),btt=$("btt");let cx;
const PC=["","#ec493e","#f5a014","#9886e5","#2cc6e2","#2ede89","#e972a5"];
function lv(){
 const v=+$("lvr").value;
 $("lvn").textContent=v+" / "+cx.m;
 $("dm").innerHTML=Array.from({length:10},(_,i)=>`<i class="${i<v?"f":""}"></i>`).join("");
 $("df").textContent=`${cx.n} (${cx.a}) — ${cx.d} [${TN[cx.t]}, Max Level ${cx.m}]`;
}
function openD(x){
 cx=x;const t=x.t;
 dlg.style.setProperty("--pip",PC[t]);
 $("dn").textContent=x.n;
 $("dt").textContent=`[${TN[t]}, Max Level ${x.m}]`;
 $("dd").textContent=x.d;
 $("da").innerHTML=x.a.split(/, | and /).map(v=>`<span>${v.replace(/</g,"&lt;")}</span>`).join("");
 const g=$("lvr");g.max=x.m;g.value=x.m;g.disabled=x.m<2;
 lv();
 dlg.showModal();
}
$("lvr").oninput=lv;$("dx").onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target===dlg)dlg.close()};

// Clean Minecraft copy format: Name (Applies To) — Description [Tier, Max Level X]
$("cp").onclick=async()=>{
 const txt=`${cx.n} (${cx.a}) — ${cx.d} [${TN[cx.t]}, Max Level ${cx.m}]`;
 try{await navigator.clipboard.writeText(txt);$("cp").textContent="Copied!";window.catSay&&catSay("Copied!")}catch(e){$("cp").textContent="Copy failed"}
 setTimeout(()=>$("cp").textContent="Copy",1500);
};

// Grid Event Delegation for Cards, Favs, and Tags
$("grid").addEventListener("click",e=>{
 const fbtn = e.target.closest(".fav-btn");
 if(fbtn){
   e.stopPropagation(); const n = fbtn.dataset.n;
   if(favs.includes(n)) favs = favs.filter(x=>x!==n); else favs.push(n);
   try{localStorage.setItem('mk-favs', JSON.stringify(favs));}catch(err){}
   fbtn.classList.toggle('on');
   if(cur==='Favs') render();
   return;
 }
 const tag = e.target.closest(".tags span:not(.lv)");
 if(tag){
   e.stopPropagation();
   cur = "All";
   sub = null;
   drawSub();
   $("q").value = tag.textContent;
   document.querySelectorAll("#chips button").forEach(b=>b.classList.toggle("on",b.dataset.k===cur));
   render();
   window.scrollTo({top:0,behavior:'smooth'});
   return;
 }
 const c=e.target.closest(".card");if(c && shown[+c.dataset.k])openD(shown[+c.dataset.k]);
});
$("grid").addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.classList.contains("card")&&shown[+e.target.dataset.k])openD(shown[+e.target.dataset.k])});
window.addEventListener('scroll',()=>{if(window.scrollY>300)btt.classList.add('show');else btt.classList.remove('show')});
btt.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
if(cur!=="All"){document.documentElement.style.setProperty('--grad1',C[cur]?C[cur][0]:'var(--lilac)');document.documentElement.style.setProperty('--grad2',C[cur]?C[cur][1]:'var(--peach)');drawSub();}
render();
</script></body></html>
